# Render Blueprint：纯静态站点（HTML + CSS + JS，无后端、无数据库、无磁盘）
# 用法：Render 控制台 → New → Blueprint → 选仓库 → Apply
services:
  - type: web
    name: fitness-tracker            # 决定域名：https://fitness-tracker.onrender.com（重名会被要求改）
    runtime: static                  # 静态站点；若提示不支持，把这行换成 env: static
    buildCommand: ""                 # 没有构建步骤，直接发布文件
    staticPublishPath: .             # 发布根目录 = index.html 所在目录
    autoDeploy: true
    headers:
      # 静态资源可以放心缓存；改代码后新的文件名不变，所以给 1 小时，别设太长
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=3600
      # Service Worker 和清单文件不要缓存，否则改了代码用户拿不到新版本
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /manifest.webmanifest
        name: Cache-Control
        value: no-cache
#
# 说明：整站只有一个 index.html，没有前端路由，因此不需要写 SPA 的 rewrite 规则。
# 加 rewrite /* → /index.html 反而可能把 assets/*.js 请求也重定向，导致白屏。
