# 健身计划 · Nginx 反向代理配置
# 用法：复制到 /etc/nginx/sites-available/fitness，改 server_name 后
#   ln -s /etc/nginx/sites-available/fitness /etc/nginx/sites-enabled/fitness
#   nginx -t && systemctl reload nginx
# 上线 HTTPS：apt install certbot python3-certbot-nginx && certbot --nginx -d 你的域名

upstream fitness_backend {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    # 没有域名就先填服务器公网 IP，或写 _ 接收所有 Host
    server_name fitness.example.com;

    # 附件上传/请求体上限（本应用请求都很小，留足余量即可）
    client_max_body_size 4m;

    # 基础安全响应头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 静态资源直接由 Nginx 提供，带长缓存
    location /static/ {
        proxy_pass http://fitness_backend;
        proxy_set_header Host $host;
        expires 7d;
        access_log off;
    }

    location / {
        proxy_pass http://fitness_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    # 健康检查不写访问日志，方便云监控轮询
    location = /health {
        access_log off;
        proxy_pass http://fitness_backend;
    }
}
