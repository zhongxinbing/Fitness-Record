# 云服务器部署：docker compose up -d
# 只监听 127.0.0.1，公网入口交给宿主机 Nginx（见 deploy/nginx.conf）
services:
  web:
    build: .
    image: fitness-tracker:latest
    container_name: fitness-tracker
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      FIT_HOST: 0.0.0.0
      FIT_PORT: "8000"
      FIT_DB_PATH: /app/data/fitness.db
      FIT_TIMEZONE: Asia/Shanghai
      FIT_SESSION_DAYS: "7"
      # 走 HTTPS（有域名 + 证书）时改为 "true"；纯 http 访问必须为 "false"，否则登录后 Cookie 存不下
      FIT_COOKIE_SECURE: "false"
      FIT_DEBUG: "false"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
